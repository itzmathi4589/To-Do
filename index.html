<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Done List</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Done List">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5A5F'/%3E%3Cpath d='M28 52 L43 67 L74 34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5A5F'/%3E%3Cpath d='M28 52 L43 67 L74 34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --ink: #24232A;
    --muted: #9A96A8;
    --line: #EEECF5;

    /* rotating accent palette */
    --c1: #FF5A5F;  /* coral */
    --c2: #FFB347;  /* mango */
    --c3: #38C9B9;  /* teal */
    --c4: #5B7FFF;  /* periwinkle */
    --c5: #C554E8;  /* violet */
    --c6: #4CD164;  /* leaf green */

    --shadow: 0 6px 16px rgba(36,35,42,0.06);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 36px 16px 90px;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,90,95,0.08), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(91,127,255,0.08), transparent 40%),
      #FFFFFF;
  }

  .app{ width:100%; max-width:520px; }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:24px;
  }

  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.01em;
    background: linear-gradient(100deg, var(--c1), var(--c4) 60%, var(--c3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .count{
    font-size:13px;
    font-weight:700;
    color: var(--muted);
    padding-bottom:6px;
  }

  .composer{
    display:flex;
    align-items:center;
    gap:8px;
    background: #FBFAFF;
    border:2px solid var(--line);
    border-radius:16px;
    padding:6px 6px 6px 18px;
    margin-bottom:26px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within{
    border-color: var(--c4);
    box-shadow: 0 0 0 4px rgba(91,127,255,0.12);
  }

  input[type="text"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:11px 0;
    min-width:0;
  }
  input[type="text"]::placeholder{ color:#B7B3C6; font-weight:600; }

  button.add{
    flex:none;
    background: linear-gradient(135deg, var(--c1), var(--c5));
    color:#fff;
    border:none;
    border-radius:12px;
    width:40px;
    height:40px;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 10px rgba(255,90,95,0.35);
    transition: transform .12s ease, opacity .15s ease;
  }
  button.add:active{ transform: scale(0.9); }

  ul{ list-style:none; margin:0; padding:0; }

  li{
    --accent: var(--c4);
    display:flex;
    align-items:flex-start;
    gap:13px;
    background: var(--panel);
    border:2px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius:14px;
    padding:15px 14px;
    margin-bottom:11px;
    box-shadow: var(--shadow);
    transition: background .2s ease, border-color .2s ease, opacity .25s ease, transform .25s ease;
  }

  li.done{
    background: #FBFCFA;
    border-left-color: var(--c6);
    opacity:0.85;
  }

  li.removing{ opacity:0; transform: translateX(14px) scale(0.98); }

  .check{
    flex:none;
    width:26px;
    height:26px;
    border-radius:9px;
    border:2.5px solid #DEDBEA;
    background:#fff;
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color .15s ease, background .15s ease;
    margin-top:1px;
    padding:0;
  }

  .check svg{
    width:15px; height:15px;
    stroke: #fff;
    stroke-width:3.4;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .3s ease;
  }

  li.done .check{
    border-color: var(--c6);
    background: var(--c6);
  }
  li.done .check svg{ stroke-dashoffset: 0; }

  .label{
    flex:1;
    font-size:15.5px;
    font-weight:700;
    line-height:1.5;
    padding-top:2px;
    word-break: break-word;
    color: var(--ink);
  }

  li.done .label{
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: #C9C5DA;
    font-weight:600;
  }

  .del{
    flex:none;
    background:transparent;
    border:none;
    color: #C9C5DA;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:2px 4px;
    transition: color .15s ease, transform .15s ease;
  }
  .del:hover{ color: var(--c1); transform: scale(1.15); }

  .empty{
    text-align:center;
    color: var(--muted);
    font-weight:600;
    font-size:14px;
    padding:48px 20px;
    border:2px dashed var(--line);
    border-radius:16px;
    line-height:1.6;
  }
  .empty strong{
    font-family:'Baloo 2', sans-serif;
    color: var(--ink);
    display:block;
    font-size:19px;
    font-weight:700;
    margin-bottom:4px;
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    font-size:12.5px;
    font-weight:700;
    color: var(--muted);
  }

  .footer-row button{
    background:none;
    border:none;
    color: var(--c5);
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    padding:4px 0;
  }
  .footer-row button:hover{ color: var(--c1); }
  .footer-row button:disabled{ opacity:0.4; cursor:default; color: var(--muted); }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background: var(--ink);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:10px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">Done!</div>
    <div class="count" id="count">0 open</div>
  </header>

  <form class="composer" id="form">
    <input type="text" id="input" placeholder="What needs doing?" maxlength="140" autocomplete="off">
    <button class="add" type="submit" aria-label="add task">+</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;">
    <strong>Nothing here yet</strong>
    Add your first task above and check it off when it's done.
  </div>

  <div class="footer-row">
    <span id="donecount">0 completed</span>
    <button id="clearDone" type="button">Clear completed</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'done-list-tasks-v1';
  const ACCENTS = ['#FF5A5F', '#FFB347', '#38C9B9', '#5B7FFF', '#C554E8', '#4CD164'];

  const listEl = document.getElementById('list');
  const formEl = document.getElementById('form');
  const inputEl = document.getElementById('input');
  const countEl = document.getElementById('count');
  const doneCountEl = document.getElementById('donecount');
  const emptyEl = document.getElementById('empty');
  const clearDoneBtn = document.getElementById('clearDone');
  const toastEl = document.getElementById('toast');

  let memoryStore = [];
  let storageAvailable = true;
  try{
    const testKey = '__done_list_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
  }catch(e){
    storageAvailable = false;
  }

  function load(){
    if(!storageAvailable) return memoryStore.slice();
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function save(tasks){
    if(!storageAvailable){
      memoryStore = tasks.slice();
      showToast('Preview mode — list resets on reload');
      return;
    }
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }catch(e){
      storageAvailable = false;
      memoryStore = tasks.slice();
    }
  }

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  let tasks = load();
  // backfill accent color for any tasks saved before this feature
  tasks = tasks.map((t, i) => t.color ? t : Object.assign({}, t, {color: ACCENTS[i % ACCENTS.length]}));

  function render(){
    listEl.innerHTML = '';
    emptyEl.style.display = tasks.length === 0 ? 'block' : 'none';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      li.style.setProperty('--accent', task.color);
      li.dataset.id = task.id;

      const check = document.createElement('button');
      check.className = 'check';
      check.setAttribute('aria-label', 'toggle complete');
      check.type = 'button';
      check.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"></polyline></svg>';
      check.addEventListener('click', () => toggle(task.id));

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label', 'delete task');
      del.textContent = '×';
      del.addEventListener('click', () => remove(task.id));

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    const open = tasks.filter(t => !t.done).length;
    const done = tasks.length - open;
    countEl.textContent = `${open} open`;
    doneCountEl.textContent = `${done} completed`;
    clearDoneBtn.disabled = done === 0;
  }

  function addTask(text){
    const trimmed = (text || '').trim();
    if(!trimmed) return;
    const color = ACCENTS[Math.floor(Math.random() * ACCENTS.length)];
    tasks = [{ id: 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2), text: trimmed, done:false, color: color }, ...tasks];
    save(tasks);
    render();
  }

  function toggle(id){
    tasks = tasks.map(t => t.id === id ? Object.assign({}, t, {done: !t.done}) : t);
    save(tasks);
    render();
  }

  function remove(id){
    const li = listEl.querySelector('li[data-id="' + id + '"]');
    const doRemove = () => {
      tasks = tasks.filter(t => t.id !== id);
      save(tasks);
      render();
    };
    if(li){
      li.classList.add('removing');
      setTimeout(doRemove, 200);
    }else{
      doRemove();
    }
  }

  clearDoneBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(tasks);
    render();
  });

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    addTask(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  render();
})();
</script>

</body>
</html>
