<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Done List</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Done List">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5A5F'/%3E%3Cpath d='M28 52 L43 67 L74 34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5A5F'/%3E%3Cpath d='M28 52 L43 67 L74 34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --field: #FBFAFF;
    --ink: #24232A;
    --muted: #9A96A8;
    --line: #EEECF5;

    --c1: #FF5A5F;
    --c2: #FFB347;
    --c3: #38C9B9;
    --c4: #5B7FFF;
    --c5: #C554E8;
    --c6: #4CD164;
    --red: #FF5A5F;

    --shadow: 0 6px 16px rgba(36,35,42,0.06);
  }

  :root[data-theme="dark"]{
    --bg: #15131B;
    --panel: #1D1A26;
    --field: #221E2D;
    --ink: #F3F1F9;
    --muted: #8D89A0;
    --line: #2C2838;
    --shadow: 0 6px 16px rgba(0,0,0,0.3);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    transition: background .2s ease, color .2s ease;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 32px 16px 90px;
  }
  :root:not([data-theme="dark"]) body{
    background:
      radial-gradient(circle at 8% 0%, rgba(255,90,95,0.07), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(91,127,255,0.07), transparent 40%),
      #FFFFFF;
  }

  .app{ width:100%; max-width:540px; }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:-0.01em;
    background: linear-gradient(100deg, var(--c1), var(--c4) 60%, var(--c3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header-right{ display:flex; align-items:center; gap:10px; }

  .theme-toggle{
    flex:none;
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid var(--line);
    background: var(--field);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }

  /* progress bar */
  .progress-wrap{
    margin-bottom:18px;
  }
  .progress-label{
    display:flex; justify-content:space-between;
    font-size:12.5px; font-weight:700; color: var(--muted);
    margin-bottom:6px;
  }
  .progress-track{
    height:9px;
    background: var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:99px;
    background: linear-gradient(90deg, var(--c6), var(--c3));
    width:0%;
    transition: width .3s ease;
  }

  /* composer */
  .composer{
    background: var(--field);
    border:2px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:16px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within{
    border-color: var(--c4);
    box-shadow: 0 0 0 4px rgba(91,127,255,0.12);
  }

  .composer-row1{
    display:flex; align-items:center; gap:8px;
  }

  input[type="text"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:8px 0;
    min-width:0;
  }
  input[type="text"]::placeholder{ color:#B7B3C6; font-weight:600; }

  button.add{
    flex:none;
    background: linear-gradient(135deg, var(--c1), var(--c5));
    color:#fff;
    border:none;
    border-radius:12px;
    width:38px;
    height:38px;
    font-size:21px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 10px rgba(255,90,95,0.3);
  }
  button.add:active{ transform: scale(0.9); }

  .composer-row2{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }

  .composer-row2 select,
  .composer-row2 input[type="date"]{
    flex:1;
    min-width:110px;
    background: var(--panel);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:7px 8px;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color: var(--ink);
    outline:none;
  }

  /* search + category filter */
  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .search-box{
    flex:1;
    display:flex;
    align-items:center;
    gap:7px;
    background: var(--field);
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:0 12px;
  }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--ink);
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:9px 0;
  }
  .search-box input::placeholder{ color:#B7B3C6; font-weight:600; }
  .search-box .icon{ font-size:13px; opacity:0.6; }

  .cat-select{
    flex:none;
    background: var(--field);
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:0 10px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color: var(--ink);
    outline:none;
    max-width:118px;
  }

  /* filter bar */
  .filter-bar{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:18px;
    scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{ display:none; }

  .chip{
    flex:none;
    font-size:12.5px;
    font-weight:700;
    padding:7px 13px;
    border-radius:99px;
    border:1.5px solid var(--line);
    background: var(--field);
    color: var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  ul{ list-style:none; margin:0; padding:0; }

  li{
    --accent: var(--c4);
    background: var(--panel);
    border:2px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:10px;
    box-shadow: var(--shadow);
    transition: background .2s ease, border-color .2s ease, opacity .25s ease, transform .25s ease;
  }

  li.done{ opacity:0.72; border-left-color: var(--c6); }
  li.removing{ opacity:0; transform: translateX(14px) scale(0.98); }

  .li-top{ display:flex; align-items:flex-start; gap:12px; }

  .check{
    flex:none;
    width:25px; height:25px;
    border-radius:9px;
    border:2.5px solid #DEDBEA;
    background: var(--panel);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
    padding:0;
    transition: border-color .15s ease, background .15s ease;
  }
  .check svg{
    width:14px; height:14px;
    stroke:#fff; stroke-width:3.4; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:20; stroke-dashoffset:20;
    transition: stroke-dashoffset .3s ease;
  }
  li.done .check{ border-color: var(--c6); background: var(--c6); }
  li.done .check svg{ stroke-dashoffset:0; }

  .label{
    flex:1;
    font-size:15.5px;
    font-weight:700;
    line-height:1.45;
    word-break: break-word;
    color: var(--ink);
    background:transparent;
    border:none;
    outline:none;
    font-family:'Nunito', sans-serif;
    padding:2px 0;
    width:100%;
  }
  li.done .label{
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: #C9C5DA;
    font-weight:600;
  }

  .icon-btn{
    flex:none;
    background:transparent;
    border:none;
    color: #C9C5DA;
    font-size:16px;
    cursor:pointer;
    padding:3px 4px;
  }
  .icon-btn:hover{ color: var(--c1); }

  .meta-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
    margin-left:37px;
    flex-wrap:wrap;
  }

  .tag{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:99px;
  }
  .tag.cat{ background: var(--line); color: var(--muted); cursor:pointer; border:none; font-family:'Nunito',sans-serif; }
  .tag.cat:hover{ background: var(--c4); color:#fff; }

  .tag.due{ background: var(--line); color: var(--muted); }
  .tag.added{ background: var(--line); color: var(--muted); }
  .tag.due.overdue{ background: rgba(255,90,95,0.15); color: var(--c1); }
  .tag.due.today{ background: rgba(91,127,255,0.15); color: var(--c4); }

  .empty{
    text-align:center;
    color: var(--muted);
    font-weight:600;
    font-size:14px;
    padding:46px 20px;
    border:2px dashed var(--line);
    border-radius:16px;
    line-height:1.6;
  }
  .empty strong{
    font-family:'Baloo 2', sans-serif;
    color: var(--ink);
    display:block;
    font-size:18px;
    font-weight:700;
    margin-bottom:4px;
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    font-size:12.5px;
    font-weight:700;
    color: var(--muted);
  }
  .footer-row button{
    background:none; border:none;
    color: var(--c5);
    font-weight:700; font-size:12.5px;
    cursor:pointer; padding:4px 0;
  }
  .footer-row button:hover{ color: var(--c1); }
  .footer-row button:disabled{ opacity:0.4; cursor:default; color: var(--muted); }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:12px;
    opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">Done!</div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" aria-label="toggle theme">🌙</button>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressText">0 of 0 done</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <form class="composer" id="form">
    <div class="composer-row1">
      <input type="text" id="input" placeholder="What needs doing?" maxlength="140" autocomplete="off">
      <button class="add" type="submit" aria-label="add task">+</button>
    </div>
    <div class="composer-row2">
      <input type="text" id="categoryInput" placeholder="Category (e.g. Work)" list="categoryOptions" maxlength="30">
      <datalist id="categoryOptions"></datalist>
      <input type="date" id="dueInput">
    </div>
  </form>

  <div class="search-row">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>
    <select class="cat-select" id="categoryFilter">
      <option value="all">All categories</option>
    </select>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="today">Today</button>
    <button class="chip" data-filter="overdue">Overdue</button>
    <button class="chip" data-filter="upcoming">Upcoming</button>
    <button class="chip" data-filter="done">Completed</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;">
    <strong>Nothing here</strong>
    Add a task above — give it a due date and your own category.
  </div>

  <div class="footer-row">
    <span id="donecount">0 completed</span>
    <button id="clearDone" type="button">Clear completed</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'done-list-tasks-v2';
  const THEME_KEY = 'done-list-theme';
  const ACCENTS = ['#FF5A5F', '#FFB347', '#38C9B9', '#5B7FFF', '#C554E8', '#4CD164'];

  const listEl = document.getElementById('list');
  const formEl = document.getElementById('form');
  const inputEl = document.getElementById('input');
  const categoryInput = document.getElementById('categoryInput');
  const categoryOptions = document.getElementById('categoryOptions');
  const dueInput = document.getElementById('dueInput');
  const emptyEl = document.getElementById('empty');
  const doneCountEl = document.getElementById('donecount');
  const clearDoneBtn = document.getElementById('clearDone');
  const toastEl = document.getElementById('toast');
  const filterBar = document.getElementById('filterBar');
  const searchInput = document.getElementById('searchInput');
  const categoryFilter = document.getElementById('categoryFilter');
  const themeToggle = document.getElementById('themeToggle');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const progressPct = document.getElementById('progressPct');

  let activeFilter = 'all';
  let activeCategory = 'all';
  let searchQuery = '';

  // ---- storage (falls back to memory if blocked, e.g. in preview) ----
  let memoryStore = [];
  let storageAvailable = true;
  try{
    const t = '__done_list_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
  }catch(e){ storageAvailable = false; }

  function load(){
    if(!storageAvailable) return memoryStore.slice();
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(tasks){
    if(!storageAvailable){
      memoryStore = tasks.slice();
      showToast('Preview mode — list resets on reload');
      return;
    }
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    catch(e){ storageAvailable = false; memoryStore = tasks.slice(); }
  }

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ---- theme ----
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    }else{
      document.documentElement.setAttribute('data-theme', 'light');
      themeToggle.textContent = '🌙';
    }
  }
  let theme = 'light';
  try{ theme = window.localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
  applyTheme(theme);

  themeToggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try{ window.localStorage.setItem(THEME_KEY, theme); }catch(e){}
  });

  // ---- date helpers ----
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatAdded(dateStr){
    if(!dateStr) return '';
    const today = todayStr();
    if(dateStr === today) return 'today';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  }
  function formatDue(dateStr){
    if(!dateStr) return null;
    const today = todayStr();
    if(dateStr === today) return {text:'Today', cls:'today'};
    const d = new Date(dateStr + 'T00:00:00');
    const t = new Date(today + 'T00:00:00');
    if(d < t) return {text:'Overdue · ' + d.toLocaleDateString(undefined,{month:'short', day:'numeric'}), cls:'overdue'};
    return {text: d.toLocaleDateString(undefined,{month:'short', day:'numeric'}), cls:''};
  }

  let tasks = load();
  tasks = tasks.map((t, i) => Object.assign({
    category: 'General', due: '', color: ACCENTS[i % ACCENTS.length], addedAt: todayStr()
  }, t));

  function refreshCategoryOptions(){
    const cats = Array.from(new Set(tasks.map(t => t.category).filter(Boolean))).sort();
    categoryOptions.innerHTML = cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '"></option>').join('');
    const currentFilterVal = categoryFilter.value;
    categoryFilter.innerHTML = '<option value="all">All categories</option>' +
      cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '">' + c + '</option>').join('');
    if(cats.includes(currentFilterVal)) categoryFilter.value = currentFilterVal;
    else { activeCategory = 'all'; categoryFilter.value = 'all'; }
  }

  function matchesFilter(task){
    if(activeCategory !== 'all' && task.category !== activeCategory) return false;
    if(searchQuery && !task.text.toLowerCase().includes(searchQuery)) return false;

    if(activeFilter === 'all') return true;
    if(activeFilter === 'done') return task.done;
    if(task.done) return false;
    if(!task.due) return false;
    const today = todayStr();
    if(activeFilter === 'today') return task.due === today;
    if(activeFilter === 'overdue') return task.due < today;
    if(activeFilter === 'upcoming') return task.due > today;
    return true;
  }

  function sortTasks(list){
    return list.slice().sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const aDue = a.due || '9999-99-99';
      const bDue = b.due || '9999-99-99';
      if(aDue !== bDue) return aDue < bDue ? -1 : 1;
      return (b.addedAt || '').localeCompare(a.addedAt || '');
    });
  }

  function render(){
    const visible = sortTasks(tasks.filter(matchesFilter));
    listEl.innerHTML = '';
    emptyEl.style.display = visible.length === 0 ? 'block' : 'none';
    if(visible.length === 0 && tasks.length > 0){
      emptyEl.querySelector('strong').textContent = 'No matches';
      emptyEl.querySelector('strong').nextSibling.textContent = 'Nothing fits this search or filter. Try clearing it.';
    }else{
      emptyEl.querySelector('strong').textContent = 'Nothing here';
      emptyEl.querySelector('strong').nextSibling.textContent = 'Add a task above — give it a due date and your own category.';
    }

    visible.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      li.style.setProperty('--accent', task.color);
      li.dataset.id = task.id;

      const top = document.createElement('div');
      top.className = 'li-top';

      const check = document.createElement('button');
      check.className = 'check';
      check.type = 'button';
      check.setAttribute('aria-label', 'toggle complete');
      check.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"></polyline></svg>';
      check.addEventListener('click', () => toggle(task.id));

      const label = document.createElement('input');
      label.className = 'label';
      label.type = 'text';
      label.value = task.text;
      label.addEventListener('change', () => editText(task.id, label.value));
      label.addEventListener('blur', () => editText(task.id, label.value));

      const del = document.createElement('button');
      del.className = 'icon-btn';
      del.type = 'button';
      del.setAttribute('aria-label', 'delete task');
      del.textContent = '✕';
      del.addEventListener('click', () => remove(task.id));

      top.appendChild(check);
      top.appendChild(label);
      top.appendChild(del);
      li.appendChild(top);

      const meta = document.createElement('div');
      meta.className = 'meta-row';

      const catTag = document.createElement('button');
      catTag.type = 'button';
      catTag.className = 'tag cat';
      catTag.textContent = task.category;
      catTag.addEventListener('click', () => {
        activeCategory = task.category;
        categoryFilter.value = task.category;
        render();
      });
      meta.appendChild(catTag);

      const addedTag = document.createElement('span');
      addedTag.className = 'tag added';
      addedTag.textContent = '🕓 Added ' + formatAdded(task.addedAt);
      meta.appendChild(addedTag);

      const dueInfo = formatDue(task.due);
      if(dueInfo){
        const dueTag = document.createElement('span');
        dueTag.className = 'tag due ' + dueInfo.cls;
        dueTag.textContent = '📅 ' + dueInfo.text;
        meta.appendChild(dueTag);
      }

      li.appendChild(meta);
      listEl.appendChild(li);
    });

    const totalOpen = tasks.filter(t => !t.done).length;
    const totalDone = tasks.length - totalOpen;
    doneCountEl.textContent = totalDone + ' completed';
    clearDoneBtn.disabled = totalDone === 0;

    const pct = tasks.length ? Math.round((totalDone / tasks.length) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressText.textContent = totalDone + ' of ' + tasks.length + ' done';
    progressPct.textContent = pct + '%';
  }

  function addTask(){
    const trimmed = inputEl.value.trim();
    if(!trimmed) return;
    const color = ACCENTS[Math.floor(Math.random() * ACCENTS.length)];
    const category = categoryInput.value.trim() || 'General';
    tasks = [{
      id: 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2),
      text: trimmed,
      done: false,
      category: category,
      due: dueInput.value || '',
      color: color,
      addedAt: todayStr()
    }, ...tasks];
    save(tasks);
    refreshCategoryOptions();
    render();
  }

  function toggle(id){
    tasks = tasks.map(t => t.id === id ? Object.assign({}, t, {done: !t.done}) : t);
    save(tasks);
    render();
  }

  function editText(id, newText){
    const trimmed = newText.trim();
    tasks = tasks.map(t => {
      if(t.id !== id) return t;
      return Object.assign({}, t, {text: trimmed || t.text});
    });
    save(tasks);
    render();
  }

  function remove(id){
    const li = listEl.querySelector('li[data-id="' + id + '"]');
    const doRemove = () => {
      tasks = tasks.filter(t => t.id !== id);
      save(tasks);
      render();
    };
    if(li){ li.classList.add('removing'); setTimeout(doRemove, 200); }
    else{ doRemove(); }
  }

  clearDoneBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(tasks);
    render();
  });

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  });

  categoryFilter.addEventListener('change', () => {
    activeCategory = categoryFilter.value;
    render();
  });

  filterBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if(!btn) return;
    activeFilter = btn.dataset.filter;
    [...filterBar.children].forEach(c => c.classList.toggle('active', c === btn));
    render();
  });

  formEl.addEventListener('submit', function(e){
    e.preventDefault();
    addTask();
    inputEl.value = '';
    dueInput.value = '';
    categoryInput.value = '';
    inputEl.focus();
  });

  refreshCategoryOptions();
  render();
})();
</script>

</body>
</html>
